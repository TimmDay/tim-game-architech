name: Deploy

# main → the live site. A pull request → its own preview URL (24 hours),
# deleted when the pull request closes: a site holds only 50 channels.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  # Mints the short-lived token Google exchanges for deploy rights (no stored key).
  id-token: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The Firebase web config: identifies the project to browsers, not secret.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
    steps:
      - uses: actions/checkout@v7
      # Third-party actions are pinned to a commit, not a movable tag.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        if: github.event.action != 'closed'

      # Workload Identity Federation: only this repository can act as the
      # Hosting-only deploy account, and only for the length of this job.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/175902897070/locations/global/workloadIdentityPools/github/providers/tim-game-architech
          service_account: github-deploy@tim-game-architech.iam.gserviceaccount.com

      - name: Preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(pnpm exec firebase hosting:channel:deploy "pr-${{ github.event.number }}" \
            --expires 1d --project tim-game-architech --json) || true
          # On failure the CLI still prints JSON, with the reason in "error".
          url=$(printf '%s' "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.status!=="success"){console.error("Preview deploy failed: "+(j.error??s));process.exit(1)}console.log(Object.values(j.result)[0].url)})')
          echo "Preview: $url"
          gh pr comment "${{ github.event.number }}" --edit-last --body "Preview: $url (expires in 24 hours: after that, run it locally; sign-in only works on the live site)" \
            || gh pr comment "${{ github.event.number }}" --body "Preview: $url (expires in 24 hours: after that, run it locally; sign-in only works on the live site)"

      # Free the channel as soon as the pull request is merged or closed.
      - name: Delete preview
        if: github.event.action == 'closed'
        run: |
          pnpm exec firebase hosting:channel:delete "pr-${{ github.event.number }}" \
            --project tim-game-architech --force \
            || echo "No preview channel to delete."

      - name: Live
        if: github.event_name == 'push'
        run: pnpm exec firebase deploy --only hosting --project tim-game-architech --non-interactive
