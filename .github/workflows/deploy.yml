name: Deploy

# main → the live site. A pull request → its own preview URL (7 days).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Mints the short-lived token Google exchanges for deploy rights (no stored key).
  id-token: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The Firebase web config: identifies the project to browsers, not secret.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
      VITE_ADMIN_UIDS: ${{ vars.VITE_ADMIN_UIDS }}
    steps:
      - uses: actions/checkout@v7
      # Third-party actions are pinned to a commit, not a movable tag.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Workload Identity Federation: only this repository can act as the
      # Hosting-only deploy account, and only for the length of this job.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/175902897070/locations/global/workloadIdentityPools/github/providers/tim-game-architech
          service_account: github-deploy@tim-game-architech.iam.gserviceaccount.com

      - name: Preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(pnpm exec firebase hosting:channel:deploy "pr-${{ github.event.number }}" \
            --expires 7d --project tim-game-architech --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).result;console.log(Object.values(r)[0].url)})')
          echo "Preview: $url"
          gh pr comment "${{ github.event.number }}" --edit-last --body "Preview: $url (expires in 7 days; sign-in only works on the live site)" \
            || gh pr comment "${{ github.event.number }}" --body "Preview: $url (expires in 7 days; sign-in only works on the live site)"

      - name: Live
        if: github.event_name == 'push'
        run: pnpm exec firebase deploy --only hosting --project tim-game-architech --non-interactive
